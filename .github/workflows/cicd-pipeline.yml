name: Java Maven CI/CD Flow with SonarCloud

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test, and Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=zhfrann
          -Dsonar.organization=zhfrann
          -Dsonar.host.url=https://sonarcloud.io

      - name: Prepare versioned JAR
        run: |
          mkdir -p dist
          jar_path=$(ls target/*.jar | head -n 1)
          cp "$jar_path" "dist/app-v0.0.${GITHUB_RUN_NUMBER}.jar"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: dist/*.jar

  publish-release-branch:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin release || true
          git checkout -B release origin/release || git checkout -B release
          git reset --hard origin/release || true
          rm -rf dist
          mkdir -p dist

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: dist

      - name: Publish JAR to release branch
        run: |
          git add dist/*.jar
          git commit -m "Release jar ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push --force-with-lease origin release

  github-release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Release v0.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}